<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* 纸张化谱面：外层是应用底色，内层是纸张 + 轻阴影。
     配色由 Dart 侧按当前主题写入 CSS 变量（默认浅色）。 */
  :root {
    --ejm-bg: #f7f7fb;
    --ejm-fg: #191a21;
    --ejm-paper: #ffffff;
    --ejm-shadow: rgba(20, 22, 31, 0.10);
    --ejm-outline: rgba(20, 22, 31, 0.08);
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ejm-bg);
    color: var(--ejm-fg);
  }
  /* 谱面长于视口时允许纵向滚动；横向溢出只有几像素（OSMD 换行余量），
     滚动条只会压住低音谱音符吞掉点击——直接隐藏 */
  body { overflow-y: auto; overflow-x: hidden; }
  /* 外层应用底色 + 容器纸张色，OSMD 谱面绘制在纸张之上 */
  #container {
    box-sizing: border-box;
    width: 100%;
    min-height: 100%;
    background: var(--ejm-paper);
    padding: 20px 22px 28px;
    transition: background 0.18s ease;
  }
  /* 滚动条收细、淡化，避免抢视线 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(128, 132, 148, 0.35);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(128, 132, 148, 0.55);
    background-clip: content-box;
  }
</style>
<script src="vendor/osmd-extended.min.js"></script>
</head>
<body>
<div id="container"></div>
<script>
(function () {
  'use strict';
  var osmd = null;
  var zoom = 1.0;
  var MAX_STEPS = 20000;
  // 最近一次 load 建好的步号表（步号 → {m, quarter}），highlight/select
  // 按事件身份定位光标时用
  var stepsMap = [];

  function post(event) {
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      window.flutter_inappwebview.callHandler('ejm', event);
    }
  }

  function quarterAtStep() {
    try {
      var ts = osmd.cursor.iterator.currentTimeStamp;
      return ts ? ts.realValue * 4 : 0;
    } catch (e) {
      return 0;
    }
  }

  // 分片异步走光标：同步走完长谱会把 JS 阻塞数秒，期间到达的点击
  // 会被输入管线整个丢弃（表现为"点一下没反应，要点两下"）。
  // 每 32 步让出一次事件循环，DOM 已渲染完成，让出的间隙点击正常命中。
  // 关键：followCursor 会让页面跟着光标走——原来走光标是一个同步块，
  // 中途不产生绘制帧所以滚动看不见；分片后每个让出点都会真实绘制，
  // 页面会可见地"滚到谱面后段再跳回来"（每次编辑都跳一下）。
  // 所以走光标全程关掉 followCursor，并在每个让出点重新钉住滚动位置。
  async function buildStepsMap() {
    osmd.cursor.reset();
    var total = 0;
    var steps = [{ step: 0, quarter: 0, m: -1 }];
    var it = osmd.cursor.iterator;
    var sx = window.scrollX, sy = window.scrollY;
    var savedFollow = null;
    try {
      savedFollow = osmd.cursor.followCursor;
      osmd.cursor.followCursor = false;
    } catch (e0) { /* 老版本无此字段时靠钉滚动兜底 */ }
    while (!it.endReached && total < MAX_STEPS) {
      for (var i = 0; i < 32 && !it.endReached && total < MAX_STEPS; i++) {
        osmd.cursor.next();
        total++;
        var m = typeof it.currentMeasureIndex === 'number' ? it.currentMeasureIndex : -1;
        steps.push({ step: total, quarter: quarterAtStep(), m: m });
      }
      window.scrollTo(sx, sy);
      await new Promise(function (r) { setTimeout(r, 0); });
    }
    try {
      if (savedFollow !== null) osmd.cursor.followCursor = savedFollow;
    } catch (e1) { /* 同上 */ }
    osmd.cursor.reset();
    return { total: total, steps: steps };
  }

  // ---- 点击选中（编辑器用）----
  // 从 OSMD 图形模型收集每个 voice entry 的 DOM 位置与事件身份：
  // m=小节下标、s=谱表下标（0基）、k=该谱表该小节内第 k 个事件。
  // 关键：notes[n].getSVGGElement() 返回的是整个 stavenote 组
  // （含符干/符尾/附点，包围盒中心偏离符头可达 25px，和弦全部音共用
  // 同一个组）——直接用它会导致点符头命中错事件。所以取组内逐个
  // vf-notehead 元素作为点击目标，并把事件身份（__ejmEi）盖到 DOM 上，
  // 点击时从 ev.target 向上找：点谁就是谁；几何最近邻只做空白处兜底。
  // 休止符没有符头，退回整组。坐标缓存为文档坐标，渲染/缩放后失效重建。

  var __entriesCache = null;
  var __selEls = null;
  var container = document.getElementById('container');

  function invalidateEntries() {
    window.__ejmInvCount = (window.__ejmInvCount || 0) + 1;
    __entriesCache = null;
    // 注意：这里只作废坐标缓存，不清蓝选中的填充色——resize 防抖触发的
    // 失效没有重渲染，元素还活着，清掉会让高亮"自己消失"（DOM 被替换
    // 的场景旧元素已是死引用，清不清都无所谓）
  }

  function collectEntries() {
    if (__entriesCache) return __entriesCache;
    var out = [];
    var sx = window.scrollX, sy = window.scrollY;
    var measures = osmd.GraphicSheet.MeasureList;
    for (var mi = 0; mi < measures.length; mi++) {
      var staves = measures[mi];
      for (var si = 0; si < staves.length; si++) {
        var gm = staves[si];
        if (!gm) continue;
        var ses = gm.staffEntries || [];
        for (var ei = 0; ei < ses.length; ei++) {
          var ves = ses[ei].graphicalVoiceEntries || [];
          if (!ves.length) continue;
          var notes = ves[0].notes || [];
          if (!notes.length) continue;
          var group = null;
          try { group = notes[0].getSVGGElement(); } catch (err) { group = null; }
          if (!group || !group.getBoundingClientRect) continue;
          var pts = [], els = [];
          var headEls = group.querySelectorAll
            ? group.querySelectorAll('[class*="vf-notehead"]') : [];
          for (var n = 0; n < headEls.length; n++) {
            if (!headEls[n].getBoundingClientRect) continue;
            var hr = headEls[n].getBoundingClientRect();
            if (!hr.width && !hr.height) continue;
            pts.push({ x: hr.left + sx + hr.width / 2, y: hr.top + sy + hr.height / 2 });
            els.push(headEls[n]);
          }
          if (!pts.length) {
            var gr = group.getBoundingClientRect();
            pts.push({ x: gr.left + sx + gr.width / 2, y: gr.top + sy + gr.height / 2 });
            els.push(group);
          }
          var idx = out.length;
          group.__ejmEi = idx;
          for (var e2 = 0; e2 < els.length; e2++) els[e2].__ejmEi = idx;
          // 事件 onset（四分音符单位）：光标按"小节+onset"精确定位到
          // 所点事件对应的步位，而不是只到小节开头
          var q = -1;
          try {
            var ts = ses[ei].getAbsoluteTimestamp();
            if (ts) q = ts.realValue * 4;
          } catch (err2) {}
          out.push({
            pts: pts, els: els, group: group,
            m: mi, s: si, k: ei, q: q
          });
        }
      }
    }
    __entriesCache = out;
    return out;
  }

  var __lastSel = null;

  function setSelection(g) {
    if (__selEls && __selEls !== g.els) {
      for (var i = 0; i < __selEls.length; i++) __selEls[i].style.fill = '';
    }
    __selEls = g.els;
    __lastSel = { m: g.m, s: g.s, k: g.k };
    for (var j = 0; j < g.els.length; j++) g.els[j].style.fill = '#1a73e8';
  }

  // 把绿光标 delta 校正到 entry 的实际位置：OSMD 光标步号与图形事件
  // 没有可靠解析映射（iterator 小节号在小节边界滞后等），走完步号后
  // 按所点事件符头的像素差修正光标 img，保证视觉零偏差
  function nudgeCursorTo(entry) {
    if (!osmd || !osmd.cursor || !osmd.cursor.cursorElement) return;
    if (!entry || !entry.els || !entry.els.length) return;
    try {
      var rSel = entry.els[0].getBoundingClientRect();
      var cEl = osmd.cursor.cursorElement;
      var cRect = cEl.getBoundingClientRect();
      var dx = (rSel.left + rSel.width / 2) - (cRect.left + cRect.width / 2);
      var dy = (rSel.top + rSel.height / 2) - (cRect.top + cRect.height / 2);
      cEl.style.left = (cEl.offsetLeft + dx) + 'px';
      cEl.style.top = (cEl.offsetTop + dy) + 'px';
    } catch (e) { /* 光标尚未创建时忽略 */ }
  }

  // 蓝选中 + 绿光标一起落到事件上；reveal 时滚动到光标可见。
  // 纯 delta 定位（O(1)）：走光标到步号再校正要同步走几百步（长谱
  // 数百 ms），而光标 img 的位置完全由 delta 决定，无需先走步号。
  function positionCursorAt(entry, reveal) {
    if (!osmd || !osmd.cursor) return;
    cursorVisible(true);
    nudgeCursorTo(entry);
    if (reveal) {
      try {
        var el = osmd.cursor.cursorElement;
        if (el && el.scrollIntoView) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } catch (e) { /* 无 cursorElement 时忽略 */ }
    }
    cursorClickThrough();
  }

  // 光标是绝对定位的 img 覆盖层，会挡住其下音符的点击（target=光标，
  // 盖章查找落空走几何兜底，密集处会选错）——设为点击穿透
  function cursorClickThrough() {
    try {
      var el = osmd.cursor && osmd.cursor.cursorElement;
      if (el && el.style) el.style.pointerEvents = 'none';
    } catch (e) { /* 光标未创建时忽略 */
    }
  }

  // 渲染后 cursor.show() 总把光标放回曲首；编辑重渲染时先把光标藏起，
  // 等调用方（编辑器的高亮恢复）重新定位后再显示——否则光标会先闪到
  // 曲首再跳回来，看起来就是"高亮到处跳"
  function cursorVisible(v) {
    try {
      var el = osmd.cursor && osmd.cursor.cursorElement;
      if (el && el.style) el.style.visibility = v ? 'visible' : 'hidden';
    } catch (e) { /* 光标未创建时忽略 */
    }
  }

  function onSheetClick(ev) {
    if (!osmd) return;
    // 诊断面包屑：所有到达页面的点击原始坐标（含未命中的）
    window.__ejmLastRawClick = {
      x: Math.round(ev.clientX * 10) / 10,
      y: Math.round(ev.clientY * 10) / 10,
      screenX: ev.screenX ? Math.round(ev.screenX) : 0,
      screenY: ev.screenY ? Math.round(ev.screenY) : 0,
      scrollY: window.scrollY
    };
    var entries = collectEntries();
    // 第一优先：被点元素自带事件身份（渲染时盖章）——符头/符干/休止符
    // 都在盖章的组内，点谁选谁，不受密集排列和符干偏移影响
    var g = null, direct = false;
    var t = ev.target;
    while (t && t !== container) {
      if (t.__ejmEi !== undefined) {
        g = entries[t.__ejmEi];
        direct = true;
        break;
      }
      t = t.parentElement;
    }
    // 兜底：空白处点击按加权距离找最近符头（Y 权重更高），阈值收紧
    var bestD = 0;
    if (!g) {
      var dx0 = ev.clientX + window.scrollX, dy0 = ev.clientY + window.scrollY;
      var best = -1, bestQ = Infinity;
      for (var a = 0; a < entries.length; a++) {
        var qs = entries[a].pts;
        for (var b = 0; b < qs.length; b++) {
          var qx = qs[b].x - dx0, qy = qs[b].y - dy0;
          var q = qx * qx + 2 * qy * qy;
          if (q < bestQ) { bestQ = q; best = a; }
        }
      }
      if (best >= 0 && bestQ <= 55 * 55) { g = entries[best]; bestD = bestQ; }
    }
    if (!g) return;
    setSelection(g);
    // 测试/诊断面包屑：最近一次命中的事件身份
    window.__ejmLastClick = {
      m: g.m, s: g.s, k: g.k,
      gi: g.els.length ? g.els[0].__ejmEi : undefined,
      dist: direct ? 0 : Math.round(Math.sqrt(bestD))
    };
    post({ event: 'noteClicked', m: g.m, s: g.s, k: g.k, q: g.q,
           gi: window.__ejmLastClick.gi });
  }

  // autoResize（窗口/容器尺寸变化触发的 OSMD 内部重渲染）不走 load/setZoom：
  // DOM 被整个重建，蓝选中与光标静默丢失且无人恢复。包一层 osmd.render，
  // 任何重渲染完成后锁滚动、作废缓存，并按最后选中自动恢复蓝选中+光标。
  var __inPatchedRender = false;

  function patchRender() {
    var orig = osmd.render.bind(osmd);
    osmd.render = function () {
      if (__inPatchedRender) return orig();
      __inPatchedRender = true;
      try {
        var sx = window.scrollX, sy = window.scrollY;
        var r = orig();
        window.scrollTo(sx, sy);
        osmd.cursor.show();
        cursorClickThrough();
        cursorVisible(false);
        invalidateEntries();
        if (__lastSel) {
          var entries = collectEntries();
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].m === __lastSel.m && entries[i].s === __lastSel.s
                && entries[i].k === __lastSel.k) {
              setSelection(entries[i]);
              positionCursorAt(entries[i], false);
              break;
            }
          }
        }
        return r;
      } finally {
        __inPatchedRender = false;
      }
    };
  }

  function ensureOsmd() {
    if (osmd) return;
    var OSD = window.opensheetmusicdisplay.OpenSheetMusicDisplay;
    osmd = new OSD('container', {
      autoResize: true,
      drawTitle: true,
      drawSubtitle: true,
      drawComposer: true,
      drawCredits: false,
      disableCursor: false,
      followCursor: true
    });
    patchRender();
  }

  async function loadMusicXml(xml, rescan) {
    ensureOsmd();
    // followCursor 会在建 steps map 走光标时把页面滚到谱面末尾，
    // osmd.cursor.reset() 又不会滚回来——全程锁住滚动位置
    var scrollY = window.scrollY;
    try {
      await osmd.load(xml);
      osmd.zoom = zoom;
      osmd.render();
      osmd.cursor.show();
      cursorClickThrough();
      // 光标此刻被放回曲首；藏起，等高亮恢复/光标定位后再显示
      cursorVisible(false);
      invalidateEntries();
      // 全谱走光标约 0.5-1s，是编辑卡顿的大头。编辑器的高亮定位是
      // delta 校正（不依赖重走步号），所以只在首次加载/换曲时重建
      // 步号表；内容小改的重渲染直接复用旧表（onset 匹配不上时
      // highlight 自动退回小节首步，视觉仍由 delta 校正保证）。
      if (rescan || !stepsMap.length) {
        var map = await buildStepsMap();
        stepsMap = map.steps;
        post({ event: 'ready', totalSteps: map.total, stepsMap: map.steps });
      }
      window.scrollTo(0, scrollY);
    } catch (e) {
      window.scrollTo(0, scrollY);
      post({ event: 'error', message: String(e && e.message || e) });
    }
  }

  function cursorTo(step, scroll) {
    if (!osmd || !osmd.cursor) return;
    // followCursor:true 时 reset/next 内部会把页面滚到光标处——每次点击
    // 都让谱面跳走，用户看到的高亮位置和点击时对不上。走光标全程锁滚动，
    // 走完恢复，再按调用方需要决定是否滚动定位。
    var sx = window.scrollX, sy = window.scrollY;
    osmd.cursor.reset();
    var i = 0;
    while (i < step && i < MAX_STEPS && !osmd.cursor.iterator.endReached) {
      osmd.cursor.next();
      i++;
    }
    window.scrollTo(sx, sy);
    cursorVisible(true);
    if (!scroll) {
      cursorClickThrough();
      return;
    }
    // osmd-extended 的 followCursor 未必在 next() 里触发滚动，兜底手动滚
    try {
      var el = osmd.cursor.cursorElement;
      if (el && el.scrollIntoView) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } catch (e) { /* 无 cursorElement 时忽略 */ }
    cursorClickThrough();
  }

  window.EJMusic = {
    handle: async function (cmd) {
      try {
        switch (cmd.op) {
          case 'load':
            if (typeof cmd.zoom === 'number') zoom = cmd.zoom;
            await loadMusicXml(cmd.xml, !!cmd.rescan);
            break;
          case 'highlight':
            if (osmd) {
              var entries = collectEntries();
              var foundHl = false;
              for (var i = 0; i < entries.length; i++) {
                if (entries[i].m === cmd.m && entries[i].s === cmd.s
                    && entries[i].k === cmd.k) {
                  setSelection(entries[i]);
                  positionCursorAt(entries[i], !!cmd.reveal);
                  foundHl = true;
                  break;
                }
              }
              window.__ejmLastHighlight = { m: cmd.m, s: cmd.s, k: cmd.k,
                entries: entries.length, found: foundHl };
            }
            break;
          case 'cursorTo':
            cursorTo(cmd.step, true);
            break;
          case 'select':
            // 保留兼容：按全局序号选中并定位光标（highlight op 已可
            // 按 m/s/k 完成同样工作，编辑器已改走 highlight）
            if (typeof cmd.idx === 'number' && osmd) {
              var gSel = collectEntries()[cmd.idx];
              if (gSel) {
                setSelection(gSel);
                positionCursorAt(gSel, false);
              }
            }
            break;
          case 'cursorReset':
            if (osmd) {
              osmd.cursor.reset();
              cursorVisible(true);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            break;
          case 'setTheme':
            // 按应用主题写入底色/文字色/纸色，使谱面与全站视觉一致
            var rt = document.documentElement.style;
            if (cmd.bg) rt.setProperty('--ejm-bg', cmd.bg);
            if (cmd.fg) rt.setProperty('--ejm-fg', cmd.fg);
            if (cmd.paper) rt.setProperty('--ejm-paper', cmd.paper);
            if (cmd.shadow) rt.setProperty('--ejm-shadow', cmd.shadow);
            if (cmd.outline) rt.setProperty('--ejm-outline', cmd.outline);
            break;
          case 'setZoom':
            zoom = cmd.zoom;
            if (osmd) {
              var sy = window.scrollY;
              osmd.zoom = zoom;
              osmd.render();
              osmd.cursor.show();
              cursorVisible(true);
              invalidateEntries();
              window.scrollTo(0, sy);
            }
            break;
          default:
            return { ok: false, error: 'unknown op' };
        }
        return { ok: true };
      } catch (e) {
        post({ event: 'error', message: String(e && e.message || e) });
        return { ok: false, error: String(e) };
      }
    }
  };

  post({ event: 'pageReady' });
  container.addEventListener('click', onSheetClick);
  // autoResize 重渲染不走 load/setZoom，窗口尺寸变化后坐标缓存要重建
  var __resizeTimer = null;
  window.addEventListener('resize', function () {
    if (__resizeTimer) clearTimeout(__resizeTimer);
    __resizeTimer = setTimeout(invalidateEntries, 400);
  });
})();
</script>
</body>
</html>
