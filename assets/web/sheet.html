<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
  /* 谱面长于视口时允许滚动；滚动容器是 body，OSMD followCursor 与
     scrollIntoView 都基于它工作 */
  body { overflow-y: auto; }
  #container { width: 100%; min-height: 100%; }
</style>
<script src="vendor/osmd-extended.min.js"></script>
</head>
<body>
<div id="container"></div>
<script>
(function () {
  'use strict';
  var osmd = null;
  var zoom = 1.0;
  var MAX_STEPS = 20000;

  function post(event) {
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      window.flutter_inappwebview.callHandler('ejm', event);
    }
  }

  function quarterAtStep() {
    try {
      var ts = osmd.cursor.iterator.currentTimeStamp;
      return ts ? ts.realValue * 4 : 0;
    } catch (e) {
      return 0;
    }
  }

  function buildStepsMap() {
    osmd.cursor.reset();
    var total = 0;
    var steps = [{ step: 0, quarter: 0 }];
    while (!osmd.cursor.iterator.endReached && total < MAX_STEPS) {
      osmd.cursor.next();
      total++;
      steps.push({ step: total, quarter: quarterAtStep() });
    }
    osmd.cursor.reset();
    return { total: total, steps: steps };
  }

  function ensureOsmd() {
    if (osmd) return;
    var OSD = window.opensheetmusicdisplay.OpenSheetMusicDisplay;
    osmd = new OSD('container', {
      autoResize: true,
      drawTitle: true,
      drawSubtitle: true,
      drawComposer: true,
      drawCredits: false,
      disableCursor: false,
      followCursor: true
    });
  }

  async function loadMusicXml(xml) {
    ensureOsmd();
    try {
      await osmd.load(xml);
      osmd.zoom = zoom;
      osmd.render();
      osmd.cursor.show();
      var map = buildStepsMap();
      post({ event: 'ready', totalSteps: map.total, stepsMap: map.steps });
    } catch (e) {
      post({ event: 'error', message: String(e && e.message || e) });
    }
  }

  function cursorTo(step) {
    if (!osmd || !osmd.cursor) return;
    osmd.cursor.reset();
    var i = 0;
    while (i < step && i < MAX_STEPS && !osmd.cursor.iterator.endReached) {
      osmd.cursor.next();
      i++;
    }
    // osmd-extended 的 followCursor 未必在 next() 里触发滚动，兜底手动滚
    try {
      var el = osmd.cursor.cursorElement;
      if (el && el.scrollIntoView) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } catch (e) { /* 无 cursorElement 时忽略 */ }
  }

  window.EJMusic = {
    handle: async function (cmd) {
      try {
        switch (cmd.op) {
          case 'load':
            await loadMusicXml(cmd.xml);
            break;
          case 'cursorTo':
            cursorTo(cmd.step);
            break;
          case 'cursorReset':
            if (osmd) {
              osmd.cursor.reset();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            break;
          case 'setZoom':
            zoom = cmd.zoom;
            if (osmd) {
              osmd.zoom = zoom;
              osmd.render();
              osmd.cursor.show();
            }
            break;
          default:
            return { ok: false, error: 'unknown op' };
        }
        return { ok: true };
      } catch (e) {
        post({ event: 'error', message: String(e && e.message || e) });
        return { ok: false, error: String(e) };
      }
    }
  };

  post({ event: 'pageReady' });
})();
</script>
</body>
</html>
