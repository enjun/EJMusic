<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
  /* 谱面长于视口时允许纵向滚动；横向溢出只有几像素（OSMD 换行余量），
     滚动条只会压住低音谱音符吞掉点击——直接隐藏 */
  body { overflow-y: auto; overflow-x: hidden; }
  #container { width: 100%; min-height: 100%; }
</style>
<script src="vendor/osmd-extended.min.js"></script>
</head>
<body>
<div id="container"></div>
<script>
(function () {
  'use strict';
  var osmd = null;
  var zoom = 1.0;
  var MAX_STEPS = 20000;

  function post(event) {
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      window.flutter_inappwebview.callHandler('ejm', event);
    }
  }

  function quarterAtStep() {
    try {
      var ts = osmd.cursor.iterator.currentTimeStamp;
      return ts ? ts.realValue * 4 : 0;
    } catch (e) {
      return 0;
    }
  }

  function buildStepsMap() {
    osmd.cursor.reset();
    var total = 0;
    var steps = [{ step: 0, quarter: 0, m: -1 }];
    while (!osmd.cursor.iterator.endReached && total < MAX_STEPS) {
      osmd.cursor.next();
      total++;
      var it = osmd.cursor.iterator;
      var m = typeof it.currentMeasureIndex === 'number' ? it.currentMeasureIndex : -1;
      steps.push({ step: total, quarter: quarterAtStep(), m: m });
    }
    osmd.cursor.reset();
    return { total: total, steps: steps };
  }

  // ---- 点击选中（编辑器用）----
  // 从 OSMD 图形模型收集每个 voice entry 的 DOM 位置与事件身份：
  // m=小节下标、s=谱表下标（0基）、k=该谱表该小节内第 k 个事件。
  // 和弦是一个 voice entry：收集该 entry 的全部符头位置——低音谱和弦密集，
  // 只记首个符头会导致点和弦下方的音时命中隔壁事件。
  // 坐标缓存为文档坐标（页面坐标+滚动量），渲染/缩放后失效重建，
  // 避免每次点击都对全部符头做 getBoundingClientRect。

  var __entriesCache = null;
  var __selEls = null;

  function invalidateEntries() {
    __entriesCache = null;
    if (__selEls) {
      for (var i = 0; i < __selEls.length; i++) __selEls[i].style.fill = '';
      __selEls = null;
    }
  }

  function collectEntries() {
    if (__entriesCache) return __entriesCache;
    var out = [];
    var sx = window.scrollX, sy = window.scrollY;
    var measures = osmd.GraphicSheet.MeasureList;
    for (var mi = 0; mi < measures.length; mi++) {
      var staves = measures[mi];
      for (var si = 0; si < staves.length; si++) {
        var gm = staves[si];
        if (!gm) continue;
        var ses = gm.staffEntries || [];
        for (var ei = 0; ei < ses.length; ei++) {
          var ves = ses[ei].graphicalVoiceEntries || [];
          if (!ves.length) continue;
          var notes = ves[0].notes || [];
          if (!notes.length) continue;
          var pts = [], els = [];
          for (var n = 0; n < notes.length; n++) {
            var el = null;
            try { el = notes[n].getSVGGElement(); } catch (err) { el = null; }
            if (!el || !el.getBoundingClientRect) continue;
            var r = el.getBoundingClientRect();
            pts.push({ x: r.left + sx + r.width / 2, y: r.top + sy + r.height / 2 });
            els.push(el);
          }
          if (!pts.length) continue;
          out.push({
            pts: pts, els: els,
            m: mi, s: si, k: ei
          });
        }
      }
    }
    __entriesCache = out;
    return out;
  }

  function setSelection(g) {
    if (__selEls && __selEls !== g.els) {
      for (var i = 0; i < __selEls.length; i++) __selEls[i].style.fill = '';
    }
    __selEls = g.els;
    for (var j = 0; j < g.els.length; j++) g.els[j].style.fill = '#1a73e8';
  }

  function onSheetClick(ev) {
    if (!osmd) return;
    // 诊断面包屑：所有到达页面的点击原始坐标（含未命中的）
    window.__ejmLastRawClick = {
      x: Math.round(ev.clientX * 10) / 10,
      y: Math.round(ev.clientY * 10) / 10,
      screenX: ev.screenX ? Math.round(ev.screenX) : 0,
      screenY: ev.screenY ? Math.round(ev.screenY) : 0,
      scrollY: window.scrollY
    };
    var entries = collectEntries();
    var dx0 = ev.clientX + window.scrollX, dy0 = ev.clientY + window.scrollY;
    // 第一轮：点击直接落在某个符头上（中心 ±11px），立即命中该事件——
    // 用户点哪个符头就选哪个，密集排列也不串
    var hit = null, hitD = Infinity;
    for (var i = 0; i < entries.length; i++) {
      var ps = entries[i].pts;
      for (var p = 0; p < ps.length; p++) {
        var ddx = ps[p].x - dx0, ddy = ps[p].y - dy0;
        if (Math.abs(ddx) <= 11 && Math.abs(ddy) <= 9) {
          var d0 = ddx * ddx + ddy * ddy;
          if (d0 < hitD) { hitD = d0; hit = entries[i]; }
        }
      }
    }
    // 第二轮：空白处点击时按加权距离找最近符头（Y 权重更高），阈值收紧
    var g = hit, bestD = hitD;
    if (!g) {
      var best = -1;
      for (var a = 0; a < entries.length; a++) {
        var qs = entries[a].pts;
        for (var b = 0; b < qs.length; b++) {
          var qx = qs[b].x - dx0, qy = qs[b].y - dy0;
          var q = qx * qx + 2 * qy * qy;
          if (q < bestD) { bestD = q; best = a; }
        }
      }
      if (best >= 0 && bestD <= 55 * 55) g = entries[best];
    }
    if (!g) return;
    setSelection(g);
    // 测试/诊断面包屑：最近一次命中的事件身份
    window.__ejmLastClick = {
      m: g.m, s: g.s, k: g.k, dist: Math.round(Math.sqrt(bestD))
    };
    post({ event: 'noteClicked', m: g.m, s: g.s, k: g.k });
  }

  function ensureOsmd() {
    if (osmd) return;
    var OSD = window.opensheetmusicdisplay.OpenSheetMusicDisplay;
    osmd = new OSD('container', {
      autoResize: true,
      drawTitle: true,
      drawSubtitle: true,
      drawComposer: true,
      drawCredits: false,
      disableCursor: false,
      followCursor: true
    });
  }

  async function loadMusicXml(xml) {
    ensureOsmd();
    // followCursor 会在建 steps map 走光标时把页面滚到谱面末尾，
    // osmd.cursor.reset() 又不会滚回来——全程锁住滚动位置
    var scrollY = window.scrollY;
    try {
      await osmd.load(xml);
      osmd.zoom = zoom;
      osmd.render();
      osmd.cursor.show();
      invalidateEntries();
      var map = buildStepsMap();
      window.scrollTo(0, scrollY);
      post({ event: 'ready', totalSteps: map.total, stepsMap: map.steps });
    } catch (e) {
      window.scrollTo(0, scrollY);
      post({ event: 'error', message: String(e && e.message || e) });
    }
  }

  function cursorTo(step, scroll) {
    if (!osmd || !osmd.cursor) return;
    osmd.cursor.reset();
    var i = 0;
    while (i < step && i < MAX_STEPS && !osmd.cursor.iterator.endReached) {
      osmd.cursor.next();
      i++;
    }
    if (!scroll) return;
    // osmd-extended 的 followCursor 未必在 next() 里触发滚动，兜底手动滚
    try {
      var el = osmd.cursor.cursorElement;
      if (el && el.scrollIntoView) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } catch (e) { /* 无 cursorElement 时忽略 */ }
  }

  window.EJMusic = {
    handle: async function (cmd) {
      try {
        switch (cmd.op) {
          case 'load':
            if (typeof cmd.zoom === 'number') zoom = cmd.zoom;
            await loadMusicXml(cmd.xml);
            break;
          case 'highlight':
            if (osmd) {
              var entries = collectEntries();
              for (var i = 0; i < entries.length; i++) {
                if (entries[i].m === cmd.m && entries[i].s === cmd.s
                    && entries[i].k === cmd.k) {
                  setSelection(entries[i]);
                  break;
                }
              }
            }
            break;
          case 'cursorTo':
            cursorTo(cmd.step, true);
            break;
          case 'select':
            cursorTo(cmd.step, false);
            break;
          case 'cursorReset':
            if (osmd) {
              osmd.cursor.reset();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            break;
          case 'setZoom':
            zoom = cmd.zoom;
            if (osmd) {
              var sy = window.scrollY;
              osmd.zoom = zoom;
              osmd.render();
              osmd.cursor.show();
              invalidateEntries();
              window.scrollTo(0, sy);
            }
            break;
          default:
            return { ok: false, error: 'unknown op' };
        }
        return { ok: true };
      } catch (e) {
        post({ event: 'error', message: String(e && e.message || e) });
        return { ok: false, error: String(e) };
      }
    }
  };

  post({ event: 'pageReady' });
  document.getElementById('container').addEventListener('click', onSheetClick);
  // autoResize 重渲染不走 load/setZoom，窗口尺寸变化后坐标缓存要重建
  var __resizeTimer = null;
  window.addEventListener('resize', function () {
    if (__resizeTimer) clearTimeout(__resizeTimer);
    __resizeTimer = setTimeout(invalidateEntries, 400);
  });
})();
</script>
</body>
</html>
